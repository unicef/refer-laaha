# Deploys a previously tagged release (created by main-pipeline.yml's
# create-release-tag job) to the Acquia Prod environment.
#
# Replaces the old `blt artifact:deploy --tag ...` step: builds the same
# production artifact by hand, pushes it to the Acquia git remote under the
# release tag, then code-switches vss2.prod to that tag.

name: Deploy to prod

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy (e.g. 2026-11-19 or 2026-11-19-v2)'
        required: true
        type: string
      confirm:
        description: 'Type DEPLOY to confirm production deployment'
        required: true
        type: string

jobs:
  deploy-prod:
    if: github.event.inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    environment: production
    strategy:
      matrix:
        php_version: ['8.4']
        node-version: [18.x]

    steps:
      - name: Validate tag exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/git/refs/tags/${{ github.event.inputs.tag }} >/dev/null

      - name: Check out tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.inputs.tag }}

      - name: Set up PHP ${{ matrix.php_version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php_version }}

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build custom theme assets
        run: |
          cd docroot/themes/custom/erpw
          npm ci --ignore-scripts
          npm run gulp

      - name: Install production-only PHP dependencies for build artifact
        run: composer install --prefer-dist --no-progress --no-dev --optimize-autoloader

      - name: Install SSH key for accessing Acquia Repository
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOST }}

      - name: Prepare build artifact
        run: |
          rm -rf .git
          printf 'node_modules/\n*.log\n' > .gitignore

      - name: Commit build artifact
        run: |
          git init
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy: ${{ github.event.inputs.tag }}" -m "Deployed from: ${{ github.repository }}@${{ github.event.inputs.tag }}"

      - name: Push build artifact to Acquia as a tag
        run: |
          ssh-keyscan -H svn-5468.devcloud.hosting.acquia.com >> ~/.ssh/known_hosts
          git remote add acquia vss2@svn-5468.devcloud.hosting.acquia.com:vss2.git
          git tag ${{ github.event.inputs.tag }}
          git push --force acquia refs/tags/${{ github.event.inputs.tag }}

      - name: Install Acquia CLI
        run: |
          curl -fsSL https://github.com/acquia/cli/releases/latest/download/acli.phar -o /tmp/acli.phar
          chmod +x /tmp/acli.phar
          sudo mv /tmp/acli.phar /usr/local/bin/acli
          acli auth:login --key="${{ secrets.API_KEY }}" --secret="${{ secrets.API_SECRET }}"

      - name: Code-switch Acquia Prod environment to the release tag
        run: |
          acli api:environments:code-switch vss2.prod "tags/${{ github.event.inputs.tag }}"
          sleep 30s

      - name: Run post-deploy Drush commands on Prod
        run: |
          ssh-keyscan -H vss2fp9ktap4b5.ssh.devcloud.acquia-sites.com >> ~/.ssh/known_hosts
          ./vendor/bin/drush @self.live cr -y
          ./vendor/bin/drush @self.live updb -y
          ./vendor/bin/drush @self.live cim -y
          ./vendor/bin/drush @self.live cr -y

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit ${{ github.event.inputs.tag }} --draft=false --prerelease=false --latest \
            --notes "$(gh release view ${{ github.event.inputs.tag }} --json body -q .body)

          ---
          🚀 Deployed to Production: $(date +'%Y-%m-%d %H:%M:%S UTC')
          Deployed by: @${{ github.actor }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
