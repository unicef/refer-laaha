# This is a basic workflow to help you get started with Actions

name: Deploy to main

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the 9.x branch
  push:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  UNICEF-Pipeline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php_version: ['8.4']
        node-version: [18.x]


    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Install chrome browser
        run: sudo apt-get update && sudo apt-get install google-chrome-stable

      - name: Set up PHP ${{ matrix.php_version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php_version }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run phpcs with Drupal coding standards.
        run: >
          ./vendor/bin/phpcs -p -s
      - name: Run phplint with Drupal coding standards.
        run: >
           ./vendor/bin/phplint
      - name: Install SSH key for accessing Acquia Repository
        uses: shimataro/ssh-key-action@v2
        with:
            key: ${{ secrets.SSH_PRIVATE }}
            known_hosts: ${{ secrets.SSH_KNOWN_HOST }}

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build custom theme assets
        run: |
          cd docroot/themes/custom/erpw
          npm ci --ignore-scripts
          npm run gulp

      - name: Install production-only PHP dependencies for build artifact
        run: composer install --prefer-dist --no-progress --no-dev --optimize-autoloader

      - name: Prepare build artifact
        run: |
          rm -rf .git
          printf 'node_modules/\n*.log\n' > .gitignore

      - name: Commit build artifact
        run: |
          git init
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy: main (${GITHUB_SHA:0:7})" -m "Deployed from: ${{ github.repository }}@${{ github.sha }}" || echo "No changes to commit"

      - name: Push build artifact to Acquia Stage environment
        run: |
          ssh-keyscan -H svn-5468.devcloud.hosting.acquia.com >> ~/.ssh/known_hosts
          git remote add acquia vss2@svn-5468.devcloud.hosting.acquia.com:vss2.git
          git push --force acquia HEAD:main

      - name: Install Acquia CLI
        run: |
          curl -fsSL https://github.com/acquia/cli/releases/latest/download/acli.phar -o /tmp/acli.phar
          chmod +x /tmp/acli.phar
          sudo mv /tmp/acli.phar /usr/local/bin/acli
          acli auth:login --key="${{ secrets.API_KEY }}" --secret="${{ secrets.API_SECRET }}"

      - name: Run post-deploy Drush commands on Stage
        env:
          # "vss2.test" alias is ambiguous for this Cloud Platform account (another
          # application also matches "vss2"), so address the Stage environment by its
          # unambiguous UUID instead (application refer / devcloud:vss2).
          ACQUIA_ENV: 325121-249931c2-c947-4980-b6e4-953c4206177c
        run: |
          for SITE_URI in bn-stage.erefer.org zw-stage.erefer.org sl-stage.erefer.org txb-stage.erefer.org; do
            acli ssh "$ACQUIA_ENV" -- "drush updb -y --uri=$SITE_URI"
            acli ssh "$ACQUIA_ENV" -- "drush cim -y --uri=$SITE_URI"
            acli ssh "$ACQUIA_ENV" -- "drush cr -y --uri=$SITE_URI"
          done

  create-release-tag:
    name: 🏷️ Create release tag for production
    needs: UNICEF-Pipeline
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate date-based release tag
        id: version
        run: |
          BASE_DATE=$(date +'%Y-%m-%d')
          TAG_NAME="$BASE_DATE"
          COUNTER=2
          while git rev-parse "refs/tags/$TAG_NAME" >/dev/null 2>&1; do
            TAG_NAME="${BASE_DATE}-v${COUNTER}"
            COUNTER=$((COUNTER + 1))
          done
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Tag and push
        run: |
          git tag -a ${{ steps.version.outputs.tag_name }} -m "Release ${{ steps.version.outputs.tag_name }}"
          git push origin ${{ steps.version.outputs.tag_name }}

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 ${{ steps.version.outputs.tag_name }}^ 2>/dev/null || echo "")
          if [ -n "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log $PREVIOUS_TAG..${{ steps.version.outputs.tag_name }} --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log ${{ steps.version.outputs.tag_name }} --pretty=format:"- %s (%h)" --no-merges)
          fi
          gh release create ${{ steps.version.outputs.tag_name }} \
            --title "Release ${{ steps.version.outputs.tag_name }}" \
            --notes "## Change Summary
          $CHANGELOG

          Deploy this release to production with the \"Deploy to prod\" workflow (workflow_dispatch), using tag \`${{ steps.version.outputs.tag_name }}\`." \
            --draft --prerelease
